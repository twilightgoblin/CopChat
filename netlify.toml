[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_PUBLIC_IS_PREVIEW = "false"
  NODE_VERSION = "18"

[context.production.environment]
  NEXT_PUBLIC_API_URL = "https://your-backend-api.netlify.app"
  NEXT_PUBLIC_IS_PREVIEW = "false"

[context.preview.environment]
  NEXT_PUBLIC_API_URL = "http://localhost:5001"
  NEXT_PUBLIC_IS_PREVIEW = "true"

[context.deploy-preview.environment]
  NEXT_PUBLIC_API_URL = "http://localhost:5001"
  NEXT_PUBLIC_IS_PREVIEW = "true"

# Build plugins
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Configure build caching
[[build.cache]]
  path = ".next/cache"
  ttl = "7d"

[[build.cache]]
  path = "node_modules/.cache"
  ttl = "7d"

[[build.cache]]
  path = ".next/cache/webpack"
  ttl = "7d"

[[build.cache]]
  path = ".next/cache/swc"
  ttl = "7d"

# Redirects for SPA and API
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: http:;"
    Cache-Control = "public, max-age=0, must-revalidate"

# Functions configuration
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client"]
  included_files = ["server/**/*"]
  directory = "netlify/functions"

# Additional security headers for API routes
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Max-Age = "86400"
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0" 