[build]
  command = "npm install --legacy-peer-deps && npm audit fix --force && npm run build"
  publish = ".next"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ./server/"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "18.19.1"
  # Explicitly disable other language runtimes
  PYTHON_VERSION = ""
  RUBY_VERSION = ""
  GO_VERSION = ""
  # Add npm configuration
  NPM_FLAGS = "--legacy-peer-deps"
  # Enable Next.js build cache
  NEXT_CACHE = "true"
  # Set build cache directory
  NEXT_CACHE_DIR = ".next/cache"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Configure build caching
[[build.cache]]
  path = ".next/cache"
  ttl = "7d"

[[build.cache]]
  path = "node_modules/.cache"
  ttl = "7d"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 