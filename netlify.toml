[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_PUBLIC_IS_PREVIEW = "false"
  NODE_VERSION = "18"

[context.production.environment]
  NEXT_PUBLIC_API_URL = "https://your-production-api-url.com"
  NEXT_PUBLIC_IS_PREVIEW = "false"

[context.preview.environment]
  NEXT_PUBLIC_API_URL = "http://localhost:5001"
  NEXT_PUBLIC_IS_PREVIEW = "true"

[context.deploy-preview.environment]
  NEXT_PUBLIC_API_URL = "http://localhost:5001"
  NEXT_PUBLIC_IS_PREVIEW = "true"

# Build plugins
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Configure build caching
[[build.cache]]
  path = ".next/cache"
  ttl = "7d"

[[build.cache]]
  path = "node_modules/.cache"
  ttl = "7d"

[[build.cache]]
  path = ".next/cache/webpack"
  ttl = "7d"

[[build.cache]]
  path = ".next/cache/swc"
  ttl = "7d"

# Redirects for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;"
    Cache-Control = "public, max-age=0, must-revalidate"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client"] 