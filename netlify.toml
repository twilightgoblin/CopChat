[build]
  command = "npm ci --legacy-peer-deps --verbose && NODE_OPTIONS='--trace-warnings' npm run build"
  publish = ".next"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ./server/"

[build.environment]
  # Node.js version
  NODE_VERSION = "18.19.1"
  NPM_VERSION = "9.8.1"
  
  # Debug logging
  DEBUG = "*"
  NODE_DEBUG = "*"
  NPM_CONFIG_LOGLEVEL = "verbose"
  
  # Disable telemetry
  NEXT_TELEMETRY_DISABLED = "1"
  
  # Explicitly disable other language runtimes
  PYTHON_VERSION = ""
  RUBY_VERSION = ""
  GO_VERSION = ""
  
  # Build optimization
  NODE_ENV = "production"
  NPM_FLAGS = "--legacy-peer-deps"
  
  # Next.js build cache
  NEXT_CACHE = "true"
  NEXT_CACHE_DIR = ".next/cache"
  
  # Build performance
  NETLIFY_NEXT_PLUGIN_SKIP = "false"
  NETLIFY_NEXT_PLUGIN_SKIP_ANALYZE = "true"

# Build plugins
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Configure build caching
[[build.cache]]
  path = ".next/cache"
  ttl = "7d"

[[build.cache]]
  path = "node_modules/.cache"
  ttl = "7d"

# Redirects for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;"
    Cache-Control = "public, max-age=0, must-revalidate" 