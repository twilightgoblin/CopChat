services:
  - type: web
    name: police-backend-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm ci --only=production
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://chikkaballapurapoliceservice.vercel.app
    healthCheckPath: /
    autoDeploy: true
